name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate drugs-data.js from single source data/drugs.json
        run: node scripts/gen-data.js

      - name: Prepare site (landing page + app + its local scripts)
        run: |
          mkdir -p site/js site/img
          cp psychopharm.html site/index.html
          cp psychopharm.html site/psychopharm.html
          cp js/auth.js site/js/auth.js
          cp js/sync.js site/js/sync.js
          cp drugs-data.js site/drugs-data.js
          cp img/download-qr.png site/img/download-qr.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
