<!DOCTYPE html>
<html lang="zh-CN">
<head>

<style>
  :root {
    --indigo: #4F46E5;
    --violet: #7C3AED;
    --ink: #0B1020;
    --text: #161D2E;
    --muted: #5B6478;
    --line: rgba(17,24,39,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background:
      radial-gradient(700px 520px at 18% -10%, rgba(124,58,237,0.16), transparent 60%),
      radial-gradient(640px 520px at 92% 110%, rgba(34,211,238,0.13), transparent 60%),
      #F4F5FB;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .topbar {
    max-width: 1000px; margin: 0 auto; padding: 26px 24px 0;
    display: flex; align-items: center; gap: 11px;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 700; color: var(--ink); }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 9px;
    background: linear-gradient(135deg, var(--indigo), var(--violet));
    display: grid; place-items: center; box-shadow: 0 6px 16px rgba(79,70,229,0.38);
  }
  .brand .logo svg { width: 19px; height: 19px; }
  .brand b { font-size: 18px; letter-spacing: 0.02em; }
  .brand span { font-family: "Sora", sans-serif; font-weight: 600; font-size: 12.5px; color: rgba(11,16,32,0.5); }
  .tagline { margin-left: auto; color: var(--muted); font-size: 14px; }

  .stage {
    max-width: 1000px; margin: 0 auto; padding: 40px 24px 56px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center;
  }

  /* ---- Phone mockup ---- */
  .phone-link { display: inline-block; text-decoration: none; justify-self: center; }
  .phone {
    width: 300px; height: 620px;
    border-radius: 44px;
    background: linear-gradient(160deg, #1a2138, #0B1020);
    padding: 13px;
    box-shadow: 0 34px 70px rgba(11,16,32,0.30);
    position: relative;
    transition: transform 0.22s ease, box-shadow 0.25s ease;
  }
  .phone-link:hover .phone { transform: translateY(-6px); box-shadow: 0 44px 84px rgba(11,16,32,0.38); }
  .phone .notch {
    position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
    width: 116px; height: 22px; background: #0B1020; border-radius: 0 0 15px 15px; z-index: 4;
  }
  .screen {
    width: 100%; height: 100%; border-radius: 32px; background: #F6F7FB; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
  }
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px 4px; font-size: 12px; font-weight: 600; color: #161D2E;
  }
  .statusbar .dots { display: flex; gap: 4px; }
  .statusbar .dots i { width: 5px; height: 5px; border-radius: 50%; background: #161D2E; opacity: 0.55; }
  .appbar { display: flex; align-items: center; gap: 9px; padding: 8px 18px 12px; }
  .appbar .mark {
    width: 26px; height: 26px; border-radius: 8px;
    background: linear-gradient(135deg, var(--indigo), var(--violet)); display: grid; place-items: center;
  }
  .appbar .mark svg { width: 15px; height: 15px; }
  .appbar .name { font-weight: 900; font-size: 15px; color: #161D2E; }
  .appbar .streak {
    margin-left: auto; font-size: 12px; font-weight: 700; color: #B45309;
    background: #FEF3C7; padding: 4px 9px; border-radius: 999px;
  }
  .sec-title { padding: 4px 18px 8px; font-size: 14px; font-weight: 700; color: #161D2E; }

  .progress-card {
    margin: 0 16px 14px; padding: 14px 16px; border-radius: 16px;
    background: linear-gradient(135deg, rgba(79,70,229,0.10), rgba(34,211,238,0.10));
    border: 1px solid rgba(79,70,229,0.16);
  }
  .progress-card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; }
  .progress-card .t { font-size: 13px; font-weight: 700; color: #161D2E; }
  .progress-card .n { font-family: "Sora", sans-serif; font-size: 13px; color: var(--indigo); font-weight: 700; }
  .bar { height: 8px; border-radius: 999px; background: rgba(17,24,39,0.10); overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 27%; border-radius: 999px; background: linear-gradient(90deg, var(--indigo), var(--violet)); }

  .card {
    margin: 0 16px 11px; padding: 12px 14px; border-radius: 14px; background: #fff;
    border: 1px solid var(--line); box-shadow: 0 6px 16px rgba(17,24,39,0.05);
  }
  .card .pill {
    display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--violet);
    background: rgba(124,58,237,0.10); padding: 2px 8px; border-radius: 999px; margin-bottom: 6px;
  }
  .card .cn { font-size: 14px; font-weight: 700; color: #161D2E; }
  .card .en { font-family: "Sora", sans-serif; font-size: 11px; color: var(--muted); margin-top: 1px; }

  .tabbar {
    margin-top: auto; display: flex; border-top: 1px solid var(--line); background: #fff;
    border-radius: 0 0 32px 32px;
  }
  .tabbar .tab {
    flex: 1; text-align: center; padding: 11px 0 13px; font-size: 11px; font-weight: 600; color: var(--muted);
  }
  .tabbar .tab.on { color: var(--indigo); }

  .enter-hint { text-align: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .enter-hint a { color: var(--indigo); text-decoration: none; font-weight: 600; }

  /* ---- Right: QR ---- */
  .side { justify-self: center; text-align: center; }
  .side .label { font-size: 15px; font-weight: 700; color: #161D2E; margin-bottom: 4px; }
  .side .sub { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .qr {
    display: inline-block; background: #fff; border: 1px solid var(--line);
    border-radius: 20px; padding: 18px; box-shadow: 0 18px 44px rgba(17,24,39,0.10);
  }
  .qr img { width: 210px; height: 210px; display: block; }
  .side .cap { margin-top: 14px; font-size: 14px; font-weight: 500; color: var(--text); }
  .side .rel { margin-top: 10px; font-size: 13px; }
  .side .rel a { color: var(--indigo); text-decoration: none; font-weight: 500; }
  .side .rel a:hover { text-decoration: underline; }

  @media (max-width: 760px) {
    .tagline { display: none; }
    .stage { grid-template-columns: 1fr; gap: 36px; padding-top: 28px; }
    .side { order: 2; }
  }
</style>
</head>
